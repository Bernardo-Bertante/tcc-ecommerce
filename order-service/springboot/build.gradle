plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.14'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.tcc'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Métricas e health check para Fargate e Prometheus
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// Stack reativo
	implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	// Migrations de schema do banco de dados
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springframework:spring-jdbc'

	// Driver JDBC do PostgreSQL (para o Flyway rodar migrations)
	runtimeOnly 'org.postgresql:postgresql'

	// Driver R2DBC do PostgreSQL 
	runtimeOnly 'org.postgresql:r2dbc-postgresql'

	// Test dependencies
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'io.projectreactor:reactor-test'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
	testImplementation 'org.testcontainers:r2dbc'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Single source of truth: copia as migrations canônicas de database/migrations/
processResources {
	from("${rootDir}/../../database/migrations") {
		into 'db/migration'
		include '**/*.sql'
	}
}
