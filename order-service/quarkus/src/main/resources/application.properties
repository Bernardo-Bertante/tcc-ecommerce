# =====================================================================
# Order Service (Quarkus + REST + Hibernate Reactive Panache)
#
# - Runtime: reativo via Hibernate Reactive + reactive PostgreSQL client.
# - Flyway: usa JDBC apenas no startup para aplicar migrations.
# - Porta e defaults mantidos coerentes com o módulo Spring Boot.
# =====================================================================

quarkus.application.name=order-service-quarkus

# --- HTTP -------------------------------------------------------------
quarkus.http.host=0.0.0.0
quarkus.http.port=${SERVER_PORT:8081}

# --- Datasource reativo ----------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:orderuser}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:orderpass}
quarkus.datasource.reactive.url=${QUARKUS_DATASOURCE_REACTIVE_URL:postgresql://localhost:55432/orderdb}
quarkus.datasource.reactive.max-size=20

# --- JDBC (somente para Flyway) --------------------------------------
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:55432/orderdb}

# --- Flyway -----------------------------------------------------------
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.validate-on-migrate=true
quarkus.flyway.locations=db/migration

# --- Health / Metrics -------------------------------------------------
quarkus.micrometer.export.prometheus.enabled=true

# --- Logging ----------------------------------------------------------
quarkus.log.level=INFO
quarkus.log.category."com.tcc.orderservice".level=INFO
quarkus.log.category."org.flywaydb".level=INFO
