name: order-service-quarkus-native

on:
  push:
    paths:
      - "database/migrations/**"
      - "infrastructure/docker-compose.test.yml"
      - "order-service/quarkus/**"
      - ".github/workflows/order-service-quarkus-native.yml"
  pull_request:
    paths:
      - "database/migrations/**"
      - "infrastructure/docker-compose.test.yml"
      - "order-service/quarkus/**"
      - ".github/workflows/order-service-quarkus-native.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Validate JVM runtime
        working-directory: order-service/quarkus
        run: ./gradlew clean test

      - name: Validate native executable runtime
        working-directory: order-service/quarkus
        run: ./gradlew quarkusIntTest -Dquarkus.native.enabled=true -Dquarkus.package.jar.enabled=false -Dquarkus.native.container-build=true -Dquarkus.native.native-image-xmx=6g --no-daemon

      - name: Build native container image
        working-directory: order-service/quarkus
        run: docker build -f Dockerfile.native -t order-service-quarkus:native .

      - name: Smoke native container
        run: |
          docker compose -f infrastructure/docker-compose.test.yml up -d
          order-service/quarkus/scripts/smoke-native-container.sh

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose -f infrastructure/docker-compose.test.yml logs --no-color

      - name: Stop compose stack
        if: always()
        run: docker compose -f infrastructure/docker-compose.test.yml down -v