quarkus.application.name=order-processor-quarkus
quarkus.funqy.export=processOrder
quarkus.jackson.write-dates-as-timestamps=false
quarkus.native.additional-build-args=--initialize-at-run-time=software.amazon.awssdk.services.dynamodb.DynamoDbRetryPolicy,--initialize-at-run-time=software.amazon.awssdk.core.retry.backoff.FullJitterBackoffStrategy

aws.region=${AWS_REGION:us-east-1}
dynamodb.endpoint=${DYNAMODB_ENDPOINT:}
order.processor.dynamodb.processed-orders-table=${PROCESSED_ORDERS_TABLE:processed_orders}
order.processor.dynamodb.stock-reservations-table=${STOCK_RESERVATIONS_TABLE:stock_reservations}