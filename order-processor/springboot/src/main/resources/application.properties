spring.application.name=order-processor-springboot
spring.main.banner-mode=off
spring.main.web-application-type=none
spring.jackson.serialization.write-dates-as-timestamps=false
spring.cloud.function.definition=processOrder

aws.region=${AWS_REGION:us-east-1}
dynamodb.endpoint=${DYNAMODB_ENDPOINT:}
order.processor.dynamodb.processed-orders-table=${PROCESSED_ORDERS_TABLE:processed_orders}
order.processor.dynamodb.stock-reservations-table=${STOCK_RESERVATIONS_TABLE:stock_reservations}