AWSTemplateFormatVersion: '2010-09-09'
Description: Minimal AWS infrastructure for the Order Service ECS Fargate benchmark.

Parameters:
  NamePrefix:
    Type: String
    Default: order-service
    Description: Prefix used for AWS resource names. Keep short to satisfy ALB target group limits.
  ImageTag:
    Type: String
    Default: latest
  SpringBootImageUri:
    Type: String
    Description: ECR image URI for the Spring Boot JVM variant.
  QuarkusJvmImageUri:
    Type: String
    Description: ECR image URI for the Quarkus JVM variant.
  QuarkusNativeImageUri:
    Type: String
    Description: ECR image URI for the Quarkus Native variant.
  BenchmarkIngressCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR allowed to reach the public ALB listeners.
  VpcCidr:
    Type: String
    Default: 10.42.0.0/16
  PublicSubnetOneCidr:
    Type: String
    Default: 10.42.1.0/24
  PublicSubnetTwoCidr:
    Type: String
    Default: 10.42.2.0/24
  ContainerPort:
    Type: Number
    Default: 8081
  TaskCpu:
    Type: String
    Default: '1024'
  TaskMemory:
    Type: String
    Default: '3072'
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 1
  MinTaskCount:
    Type: Number
    Default: 1
    MinValue: 1
  MaxTaskCount:
    Type: Number
    Default: 5
    MinValue: 1
  CpuScaleTargetValue:
    Type: Number
    Default: 70
    MinValue: 1
    MaxValue: 100
  LogRetentionInDays:
    Type: Number
    Default: 14
    AllowedValues:
      - 1
      - 3
      - 5
      - 7
      - 14
      - 30
      - 60
      - 90
      - 120
      - 150
      - 180
      - 365
      - 400
      - 545
      - 731
      - 1096
      - 1827
      - 2192
      - 2557
      - 2922
      - 3288
      - 3653
  DatabaseName:
    Type: String
    Default: orderdb
  DatabaseUsername:
    Type: String
    Default: orderuser
  DatabasePassword:
    Type: String
    NoEcho: true
    MinLength: 8
    MaxLength: 128
  DbInstanceClass:
    Type: String
    Default: db.t3.micro
  DbAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
  DbEngineVersion:
    Type: String
    Default: '16.14'
  ExistingTaskExecutionRoleArn:
    Type: String
    Default: ''
    Description: Optional existing IAM role ARN for ECS task execution. Leave empty to create one.
  ExistingTaskRoleArn:
    Type: String
    Default: ''
    Description: Optional existing IAM role ARN for ECS task role. Leave empty to create one.

Conditions:
  CreateTaskExecutionRole: !Equals [!Ref ExistingTaskExecutionRoleArn, '']
  CreateTaskRole: !Equals [!Ref ExistingTaskRoleArn, '']

Mappings:
  VariantConfig:
    SpringBoot:
      ListenerPort: 8083
      HealthPath: /actuator/health
    QuarkusJvm:
      ListenerPort: 8082
      HealthPath: /q/health
    QuarkusNative:
      ListenerPort: 8081
      HealthPath: /q/health

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub '${NamePrefix}-vpc'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${NamePrefix}-igw'

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref Vpc

  PublicSubnetOne:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Ref PublicSubnetOneCidr
      MapPublicIpOnLaunch: true
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${NamePrefix}-public-a'

  PublicSubnetTwo:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: !Ref PublicSubnetTwoCidr
      MapPublicIpOnLaunch: true
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${NamePrefix}-public-b'

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${NamePrefix}-public-rt'

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetOneRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetOne

  PublicSubnetTwoRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetTwo

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow benchmark traffic to Order Service ALB listeners.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8081
          ToPort: 8083
          CidrIp: !Ref BenchmarkIngressCidr
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${NamePrefix}-alb-sg'

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow ALB traffic to Order Service Fargate tasks.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref ContainerPort
          ToPort: !Ref ContainerPort
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${NamePrefix}-task-sg'

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow PostgreSQL access from Order Service Fargate tasks only.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref TaskSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${NamePrefix}-db-sg'

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets for the Order Service benchmark PostgreSQL instance.
      SubnetIds:
        - !Ref PublicSubnetOne
        - !Ref PublicSubnetTwo
      Tags:
        - Key: Name
          Value: !Sub '${NamePrefix}-db-subnets'

  OrderServiceDatabase:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub '${NamePrefix}-postgres'
      AllocatedStorage: !Ref DbAllocatedStorage
      DBInstanceClass: !Ref DbInstanceClass
      DBName: !Ref DatabaseName
      Engine: postgres
      EngineVersion: !Ref DbEngineVersion
      MasterUsername: !Ref DatabaseUsername
      MasterUserPassword: !Ref DatabasePassword
      PubliclyAccessible: false
      StorageEncrypted: true
      BackupRetentionPeriod: 0
      DeletionProtection: false
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub '${NamePrefix}-postgres'

  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${NamePrefix}-cluster'
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Condition: CreateTaskExecutionRole
    Properties:
      RoleName: !Sub '${NamePrefix}-task-execution-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  TaskRole:
    Type: AWS::IAM::Role
    Condition: CreateTaskRole
    Properties:
      RoleName: !Sub '${NamePrefix}-task-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole

  SpringBootLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${NamePrefix}-springboot'
      RetentionInDays: !Ref LogRetentionInDays

  QuarkusJvmLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${NamePrefix}-quarkus-jvm'
      RetentionInDays: !Ref LogRetentionInDays

  QuarkusNativeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${NamePrefix}-quarkus-native'
      RetentionInDays: !Ref LogRetentionInDays

  DbResetLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${NamePrefix}-db-reset'
      RetentionInDays: !Ref LogRetentionInDays

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${NamePrefix}-alb'
      Scheme: internet-facing
      Type: application
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Subnets:
        - !Ref PublicSubnetOne
        - !Ref PublicSubnetTwo
      Tags:
        - Key: Name
          Value: !Sub '${NamePrefix}-alb'

  SpringBootTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${NamePrefix}-spring-tg'
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: !Ref ContainerPort
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckPath: !FindInMap [VariantConfig, SpringBoot, HealthPath]
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'

  QuarkusJvmTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${NamePrefix}-qjvm-tg'
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: !Ref ContainerPort
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckPath: !FindInMap [VariantConfig, QuarkusJvm, HealthPath]
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'

  QuarkusNativeTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${NamePrefix}-qnative-tg'
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: !Ref ContainerPort
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckPath: !FindInMap [VariantConfig, QuarkusNative, HealthPath]
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'

  SpringBootListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: !FindInMap [VariantConfig, SpringBoot, ListenerPort]
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref SpringBootTargetGroup

  QuarkusJvmListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: !FindInMap [VariantConfig, QuarkusJvm, ListenerPort]
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref QuarkusJvmTargetGroup

  QuarkusNativeListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: !FindInMap [VariantConfig, QuarkusNative, ListenerPort]
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref QuarkusNativeTargetGroup

  SpringBootTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${NamePrefix}-springboot'
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !If [CreateTaskExecutionRole, !GetAtt TaskExecutionRole.Arn, !Ref ExistingTaskExecutionRoleArn]
      TaskRoleArn: !If [CreateTaskRole, !GetAtt TaskRole.Arn, !Ref ExistingTaskRoleArn]
      ContainerDefinitions:
        - Name: springboot
          Image: !Ref SpringBootImageUri
          Essential: true
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Protocol: tcp
          Environment:
            - Name: SERVER_PORT
              Value: !Ref ContainerPort
            - Name: SPRING_R2DBC_URL
              Value: !Sub
                - 'r2dbc:postgresql://${DbHost}:5432/${DatabaseName}?sslMode=REQUIRE'
                - DbHost: !GetAtt OrderServiceDatabase.Endpoint.Address
            - Name: SPRING_R2DBC_USERNAME
              Value: !Ref DatabaseUsername
            - Name: SPRING_R2DBC_PASSWORD
              Value: !Ref DatabasePassword
            - Name: SPRING_FLYWAY_URL
              Value: !Sub
                - 'jdbc:postgresql://${DbHost}:5432/${DatabaseName}?sslmode=require'
                - DbHost: !GetAtt OrderServiceDatabase.Endpoint.Address
            - Name: SPRING_FLYWAY_USER
              Value: !Ref DatabaseUsername
            - Name: SPRING_FLYWAY_PASSWORD
              Value: !Ref DatabasePassword
            - Name: JAVA_OPTS_APPEND
              Value: '-Xms512m -Xmx2g -XX:MaxMetaspaceSize=256m'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref SpringBootLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: springboot

  QuarkusJvmTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${NamePrefix}-quarkus-jvm'
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !If [CreateTaskExecutionRole, !GetAtt TaskExecutionRole.Arn, !Ref ExistingTaskExecutionRoleArn]
      TaskRoleArn: !If [CreateTaskRole, !GetAtt TaskRole.Arn, !Ref ExistingTaskRoleArn]
      ContainerDefinitions:
        - Name: quarkus-jvm
          Image: !Ref QuarkusJvmImageUri
          Essential: true
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Protocol: tcp
          Environment:
            - Name: SERVER_PORT
              Value: !Ref ContainerPort
            - Name: QUARKUS_DATASOURCE_USERNAME
              Value: !Ref DatabaseUsername
            - Name: QUARKUS_DATASOURCE_PASSWORD
              Value: !Ref DatabasePassword
            - Name: QUARKUS_DATASOURCE_REACTIVE_URL
              Value: !Sub
                - 'postgresql://${DbHost}:5432/${DatabaseName}'
                - DbHost: !GetAtt OrderServiceDatabase.Endpoint.Address
            - Name: QUARKUS_DATASOURCE_JDBC_URL
              Value: !Sub
                - 'jdbc:postgresql://${DbHost}:5432/${DatabaseName}?sslmode=require'
                - DbHost: !GetAtt OrderServiceDatabase.Endpoint.Address
            - Name: QUARKUS_DATASOURCE_REACTIVE_POSTGRESQL_SSL_MODE
              Value: REQUIRE
            - Name: QUARKUS_DATASOURCE_REACTIVE_TRUST_ALL
              Value: 'true'
            - Name: JAVA_OPTS_APPEND
              Value: '-Dquarkus.http.host=0.0.0.0 -Xms512m -Xmx1536m -XX:MaxMetaspaceSize=256m'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref QuarkusJvmLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: quarkus-jvm

  QuarkusNativeTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${NamePrefix}-quarkus-native'
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !If [CreateTaskExecutionRole, !GetAtt TaskExecutionRole.Arn, !Ref ExistingTaskExecutionRoleArn]
      TaskRoleArn: !If [CreateTaskRole, !GetAtt TaskRole.Arn, !Ref ExistingTaskRoleArn]
      ContainerDefinitions:
        - Name: quarkus-native
          Image: !Ref QuarkusNativeImageUri
          Essential: true
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Protocol: tcp
          Environment:
            - Name: SERVER_PORT
              Value: !Ref ContainerPort
            - Name: QUARKUS_DATASOURCE_USERNAME
              Value: !Ref DatabaseUsername
            - Name: QUARKUS_DATASOURCE_PASSWORD
              Value: !Ref DatabasePassword
            - Name: QUARKUS_DATASOURCE_REACTIVE_URL
              Value: !Sub
                - 'postgresql://${DbHost}:5432/${DatabaseName}'
                - DbHost: !GetAtt OrderServiceDatabase.Endpoint.Address
            - Name: QUARKUS_DATASOURCE_JDBC_URL
              Value: !Sub
                - 'jdbc:postgresql://${DbHost}:5432/${DatabaseName}?sslmode=require'
                - DbHost: !GetAtt OrderServiceDatabase.Endpoint.Address
            - Name: QUARKUS_DATASOURCE_REACTIVE_POSTGRESQL_SSL_MODE
              Value: REQUIRE
            - Name: QUARKUS_DATASOURCE_REACTIVE_TRUST_ALL
              Value: 'true'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref QuarkusNativeLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: quarkus-native

  DbResetTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${NamePrefix}-db-reset'
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !If [CreateTaskExecutionRole, !GetAtt TaskExecutionRole.Arn, !Ref ExistingTaskExecutionRoleArn]
      TaskRoleArn: !If [CreateTaskRole, !GetAtt TaskRole.Arn, !Ref ExistingTaskRoleArn]
      ContainerDefinitions:
        - Name: db-reset
          Image: public.ecr.aws/docker/library/postgres:16-alpine
          Essential: true
          Command:
            - sh
            - -lc
            - >-
              psql "host=$DB_HOST port=5432 dbname=$DB_NAME user=$DB_USER sslmode=require" -v ON_ERROR_STOP=1
              -c "TRUNCATE TABLE order_status_history, order_items, orders RESTART IDENTITY CASCADE;"
          Environment:
            - Name: DB_HOST
              Value: !GetAtt OrderServiceDatabase.Endpoint.Address
            - Name: DB_NAME
              Value: !Ref DatabaseName
            - Name: DB_USER
              Value: !Ref DatabaseUsername
            - Name: PGPASSWORD
              Value: !Ref DatabasePassword
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref DbResetLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: db-reset

  SpringBootService:
    Type: AWS::ECS::Service
    DependsOn:
      - SpringBootListener
      - OrderServiceDatabase
    Properties:
      ServiceName: !Sub '${NamePrefix}-springboot'
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref SpringBootTaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 120
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref TaskSecurityGroup
          Subnets:
            - !Ref PublicSubnetOne
            - !Ref PublicSubnetTwo
      LoadBalancers:
        - ContainerName: springboot
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref SpringBootTargetGroup

  QuarkusJvmService:
    Type: AWS::ECS::Service
    DependsOn:
      - QuarkusJvmListener
      - OrderServiceDatabase
    Properties:
      ServiceName: !Sub '${NamePrefix}-quarkus-jvm'
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref QuarkusJvmTaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 120
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref TaskSecurityGroup
          Subnets:
            - !Ref PublicSubnetOne
            - !Ref PublicSubnetTwo
      LoadBalancers:
        - ContainerName: quarkus-jvm
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref QuarkusJvmTargetGroup

  QuarkusNativeService:
    Type: AWS::ECS::Service
    DependsOn:
      - QuarkusNativeListener
      - OrderServiceDatabase
    Properties:
      ServiceName: !Sub '${NamePrefix}-quarkus-native'
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref QuarkusNativeTaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 120
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref TaskSecurityGroup
          Subnets:
            - !Ref PublicSubnetOne
            - !Ref PublicSubnetTwo
      LoadBalancers:
        - ContainerName: quarkus-native
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref QuarkusNativeTargetGroup

  SpringBootScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: !Ref MaxTaskCount
      MinCapacity: !Ref MinTaskCount
      ResourceId: !Sub
        - service/${ClusterName}/${ServiceName}
        - ClusterName: !Ref EcsCluster
          ServiceName: !GetAtt SpringBootService.Name
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs

  SpringBootCpuScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub '${NamePrefix}-springboot-cpu-target'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref SpringBootScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        ScaleInCooldown: 120
        ScaleOutCooldown: 60
        TargetValue: !Ref CpuScaleTargetValue

  QuarkusJvmScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: !Ref MaxTaskCount
      MinCapacity: !Ref MinTaskCount
      ResourceId: !Sub
        - service/${ClusterName}/${ServiceName}
        - ClusterName: !Ref EcsCluster
          ServiceName: !GetAtt QuarkusJvmService.Name
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs

  QuarkusJvmCpuScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub '${NamePrefix}-quarkus-jvm-cpu-target'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref QuarkusJvmScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        ScaleInCooldown: 120
        ScaleOutCooldown: 60
        TargetValue: !Ref CpuScaleTargetValue

  QuarkusNativeScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: !Ref MaxTaskCount
      MinCapacity: !Ref MinTaskCount
      ResourceId: !Sub
        - service/${ClusterName}/${ServiceName}
        - ClusterName: !Ref EcsCluster
          ServiceName: !GetAtt QuarkusNativeService.Name
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs

  QuarkusNativeCpuScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub '${NamePrefix}-quarkus-native-cpu-target'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref QuarkusNativeScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        ScaleInCooldown: 120
        ScaleOutCooldown: 60
        TargetValue: !Ref CpuScaleTargetValue

Outputs:
  ImageTag:
    Value: !Ref ImageTag
  VpcId:
    Value: !Ref Vpc
  PublicSubnetIds:
    Value: !Join [',', [!Ref PublicSubnetOne, !Ref PublicSubnetTwo]]
  TaskSecurityGroupId:
    Value: !Ref TaskSecurityGroup
  EcsClusterName:
    Value: !Ref EcsCluster
  SpringBootServiceName:
    Value: !GetAtt SpringBootService.Name
  QuarkusJvmServiceName:
    Value: !GetAtt QuarkusJvmService.Name
  QuarkusNativeServiceName:
    Value: !GetAtt QuarkusNativeService.Name
  SpringBootTargetGroupArn:
    Value: !Ref SpringBootTargetGroup
  QuarkusJvmTargetGroupArn:
    Value: !Ref QuarkusJvmTargetGroup
  QuarkusNativeTargetGroupArn:
    Value: !Ref QuarkusNativeTargetGroup
  LoadBalancerDnsName:
    Value: !GetAtt ApplicationLoadBalancer.DNSName
  LoadBalancerFullName:
    Value: !GetAtt ApplicationLoadBalancer.LoadBalancerFullName
  SpringBootBaseUrl:
    Value: !Sub
      - 'http://${DnsName}:${Port}'
      - DnsName: !GetAtt ApplicationLoadBalancer.DNSName
        Port: !FindInMap [VariantConfig, SpringBoot, ListenerPort]
  QuarkusJvmBaseUrl:
    Value: !Sub
      - 'http://${DnsName}:${Port}'
      - DnsName: !GetAtt ApplicationLoadBalancer.DNSName
        Port: !FindInMap [VariantConfig, QuarkusJvm, ListenerPort]
  QuarkusNativeBaseUrl:
    Value: !Sub
      - 'http://${DnsName}:${Port}'
      - DnsName: !GetAtt ApplicationLoadBalancer.DNSName
        Port: !FindInMap [VariantConfig, QuarkusNative, ListenerPort]
  DatabaseEndpointAddress:
    Value: !GetAtt OrderServiceDatabase.Endpoint.Address
  DatabaseInstanceIdentifier:
    Value: !Ref OrderServiceDatabase
  DbResetTaskDefinitionArn:
    Value: !Ref DbResetTaskDefinition
  TaskExecutionRoleArn:
    Value: !If [CreateTaskExecutionRole, !GetAtt TaskExecutionRole.Arn, !Ref ExistingTaskExecutionRoleArn]
  TaskRoleArn:
    Value: !If [CreateTaskRole, !GetAtt TaskRole.Arn, !Ref ExistingTaskRoleArn]